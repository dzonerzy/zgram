name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_call:
    workflow_dispatch:

jobs:
    # One portable abi3 wheel per platform (cp310-abi3: CPython 3.10+). Both
    # are built on Linux: the Windows wheel is cross-compiled, which takes a
    # minute where a Windows runner took three and a half. The tests below
    # run each wheel on its own OS.
    build:
        name: Build wheel (${{ matrix.platform }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: Linux
                      target: ""
                    - platform: Windows
                      target: x86_64-windows
        steps:
            - uses: actions/checkout@v4

            # Downloads from the community mirrors (ziglang.org itself took up
            # to 7 minutes); our own cache below keeps the build cache
            - name: Setup Zig
              uses: mlugg/setup-zig@v2
              with:
                  version: 0.16.0
                  use-cache: false

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            # LLVM static libs are ~150 MB per platform; don't refetch every run
            - name: Cache Zig packages
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/zig
                      zig-pkg
                  key: zig-${{ matrix.platform }}-${{ hashFiles('build.zig.zon') }}
                  restore-keys: zig-${{ matrix.platform }}-

            - name: Install PyOZ
              run: python -m pip install "pyoz>=0.13.7"

            - name: Build wheel
              run: pyoz build --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

            - name: Check the extension really uses the Stable ABI
              if: matrix.platform == 'Linux'
              run: |
                  unzip -o -q dist/*.whl zgram.so -d /tmp/whl
                  nm -D /tmp/whl/zgram.so | grep -q " U PyType_FromSpec" || { echo "not an abi3 build"; exit 1; }

            - uses: actions/upload-artifact@v4
              with:
                  name: wheel-${{ matrix.platform }}
                  path: dist/*.whl
                  if-no-files-found: error

    test:
        name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
        needs: build
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python-version: ["3.10", "3.12", "3.14"]
        steps:
            - uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - uses: actions/download-artifact@v4
              with:
                  name: wheel-${{ runner.os }}
                  path: dist

            - name: Install wheel
              shell: bash
              run: python -m pip install dist/*.whl pytest pytest-timeout

            # Each stage prints before the next, so a hang shows where it is
            - name: Smoke test
              timeout-minutes: 5
              shell: bash
              run: |
                  python -X faulthandler - <<'PY'
                  import faulthandler, sys
                  faulthandler.dump_traceback_later(120, exit=True)
                  print("importing", flush=True)
                  import zgram
                  print("imported", zgram.__file__, zgram.version(), flush=True)
                  p = zgram.compile("a = 'x'+\n")
                  print("compiled", p, flush=True)
                  print("parsed", p.parse("xxx").to_tuple(), flush=True)
                  PY

            - name: Run tests
              timeout-minutes: 20
              run: python -m pytest test -v -o faulthandler_timeout=120 --timeout=300
