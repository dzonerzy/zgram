name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_call:

jobs:
    # One portable abi3 wheel per platform (cp310-abi3: CPython 3.10+)
    build:
        name: Build wheel (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        steps:
            - uses: actions/checkout@v4

            - name: Setup Zig
              uses: goto-bus-stop/setup-zig@v2
              with:
                  version: 0.16.0

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            # LLVM static libs are ~150 MB per platform; don't refetch every run
            - name: Cache Zig packages
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/zig
                      ~/AppData/Local/zig
                      zig-pkg
                  key: zig-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
                  restore-keys: zig-${{ runner.os }}-

            - name: Install PyOZ
              run: python -m pip install "pyoz>=0.13.3"

            - name: Build wheel
              run: pyoz build --release

            - name: Check the extension really uses the Stable ABI
              if: runner.os == 'Linux'
              run: |
                  unzip -o -q dist/*.whl zgram.so -d /tmp/whl
                  nm -D /tmp/whl/zgram.so | grep -q " U PyType_FromSpec" || { echo "not an abi3 build"; exit 1; }

            - uses: actions/upload-artifact@v4
              with:
                  name: wheel-${{ runner.os }}
                  path: dist/*.whl
                  if-no-files-found: error

    test:
        name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
        needs: build
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python-version: ["3.10", "3.12", "3.14"]
        steps:
            - uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - uses: actions/download-artifact@v4
              with:
                  name: wheel-${{ runner.os }}
                  path: dist

            - name: Install wheel
              shell: bash
              run: python -m pip install dist/*.whl pytest

            - name: Run tests
              run: python -m pytest test -q
